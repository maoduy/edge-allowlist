name: Build KidNest Setup.exe

# The installer has to be built on Windows - PyInstaller does not cross-compile.
# Everything the installer needs is baked into the exe, so the people you share it
# with need nothing on their PC: no Python, no downloads, just the exe and a sheet link.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'setup/**'
      - 'proxy/**'
      - '.github/workflows/build-setup.yml'

permissions:
  contents: write

env:
  MITM_VERSION: '12.2.3'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install --disable-pip-version-check pyinstaller==6.11.1

      - name: Fetch mitmproxy to bundle
        shell: pwsh
        run: |
          $url = "https://downloads.mitmproxy.org/$env:MITM_VERSION/mitmproxy-$env:MITM_VERSION-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile mitm.zip -UseBasicParsing
          Expand-Archive mitm.zip -DestinationPath mitm -Force
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          Copy-Item mitm\mitmdump.exe payload\ -Force
          Copy-Item proxy\*.ps1, proxy\*.py, proxy\*.cmd payload\ -Force
          Copy-Item setup\reset-clean.ps1, setup\KidNest-Unlock.bat payload\ -Force
          Get-ChildItem payload | Format-Table Name, Length

      - name: Build the exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin `
            --name "KidNest-Setup" `
            --add-data "payload\install.ps1;." `
            --add-data "payload\uninstall.ps1;." `
            --add-data "payload\kidproxy.py;." `
            --add-data "payload\sheetlog.py;." `
            --add-data "payload\kidproxy.cmd;." `
            --add-data "payload\reset-clean.ps1;." `
            --add-data "payload\diagnose.ps1;." `
            --add-data "payload\KidNest-Unlock.bat;." `
            --add-data "payload\kidnest-pause.ps1;." `
            --add-data "payload\kidnest-watchdog.ps1;." `
            --add-data "payload\kidnest-test.ps1;." `
            --add-data "payload\kidnest-supervisor.ps1;." `
            --add-data "payload\mitmdump.exe;." `
            setup\kidnest_setup.py

      - name: Check the result
        shell: pwsh
        run: |
          $exe = "dist\KidNest-Setup.exe"
          if (-not (Test-Path $exe)) { throw "build produced no exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Built $exe  ($mb MB)"
          if ($mb -lt 10) { throw "exe is only $mb MB - the payload did not get bundled" }

      - name: Also pack a password-protected zip
        shell: pwsh
        run: |
          # Browsers and Defender block a bare unsigned .exe. They cannot inspect an
          # encrypted archive, so this one downloads without a fight. ZipCrypto, not
          # AES, because more tools can open it.
          & "$env:ProgramFiles\7-Zip\7z.exe" a -tzip -p123456 `
            "dist\KidNest-Setup.zip" "dist\KidNest-Setup.exe" | Out-Null
          if (-not (Test-Path "dist\KidNest-Setup.zip")) { throw "zip not produced" }
          $mb = [math]::Round((Get-Item "dist\KidNest-Setup.zip").Length / 1MB, 1)
          Write-Host "Packed dist\KidNest-Setup.zip ($mb MB, password 123456)"

      - uses: actions/upload-artifact@v4
        with:
          name: KidNest-Setup
          path: dist/KidNest-Setup.exe
          retention-days: 90

      - name: Publish as the 'latest' release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest "dist\KidNest-Setup.exe" "dist\KidNest-Setup.zip" "setup\reset-clean.ps1" "proxy\diagnose.ps1" "setup\KidNest-Unlock.bat" `
            --title "KidNest Setup (latest)" `
            --notes "**KidNest-Setup.exe** - one-click installer. Download, run, paste your Google Sheet link, pick the accounts to protect.`n`n**reset-clean.ps1** - only if an older version was installed: run it as Administrator first to clear everything out. It backs up to your Desktop and writes a restore.cmd.`n`n**KidNest-Setup.zip** - the same exe inside a password-protected zip (password ``123456``), for when the browser or Defender refuses the plain .exe. Needs 7-Zip or WinRAR to extract.`n`nBuilt from $env:GITHUB_SHA."

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trang bị chặn</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#f4f5f7; color:#222;
         display:flex; align-items:center; justify-content:center; height:100vh; }
  .card { background:#fff; padding:40px 48px; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.08); max-width:560px; text-align:center; }
  h1 { font-size:22px; margin:0 0 12px; }
  p { margin:8px 0; color:#555; }
  code { display:block; margin-top:14px; padding:10px; background:#f0f0f0; border-radius:6px; word-break:break-all; font-size:13px; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Trang này không nằm trong danh sách được phép</h1>
  <p id="why">Chỉ có thể truy cập các trang web đã được duyệt.</p>
  <code id="url"></code>
</div>
<script src="blocked.js"></script>
</body>
</html>
